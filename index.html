<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f14;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 35px;
    }

    .upload-box {
      border: 2px dashed #555;
      border-radius: 20px;
      padding: 45px 20px;
      text-align: center;
      background: #181820;
    }

    input[type="file"] {
      margin: 20px 0;
      color: white;
    }

    button {
      background: #ffffff;
      color: #111;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    video {
      display: none;
      width: 100%;
      max-height: 450px;
      margin-top: 25px;
      border-radius: 15px;
    }

    .results {
      display: none;
      margin-top: 30px;
    }

    .score {
      text-align: center;
      background: #181820;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .score-number {
      font-size: 60px;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: #181820;
      padding: 20px;
      border-radius: 15px;
    }

    .card h3 {
      margin-top: 0;
    }

    .value {
      font-size: 25px;
      font-weight: bold;
    }

    .tip {
      background: #181820;
      padding: 25px;
      border-radius: 15px;
      margin-top: 20px;
      line-height: 1.6;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎬 Reel Analyzer</h1>

  <p class="subtitle">
    Upload your Reel and get a basic performance analysis.
  </p>

  <div class="upload-box">

    <h2>Upload your Reel</h2>

    <p>MP4, MOV or WebM</p>

    <input
      type="file"
      id="videoInput"
      accept="video/*"
    >

    <br>

    <button onclick="analyzeVideo()">
      Analyze Reel
    </button>

    <p id="status"></p>

  </div>

  <video id="video" controls></video>

  <div class="results" id="results">

    <div class="score">

      <div>Your Reel Score</div>

      <div class="score-number" id="overallScore">
        --
      </div>

      <div>/ 100</div>

    </div>

    <div class="cards">

      <div class="card">
        <h3>⏱️ Duration</h3>
        <div class="value" id="duration">--</div>
      </div>

      <div class="card">
        <h3>🎬 Scene Changes</h3>
        <div class="value" id="sceneChanges">--</div>
      </div>

      <div class="card">
        <h3>⚡ Pacing</h3>
        <div class="value" id="pacing">--</div>
      </div>

      <div class="card">
        <h3>📱 Format</h3>
        <div class="value" id="format">--</div>
      </div>

    </div>

    <div class="tip">

      <h2>💡 Analysis</h2>

      <p id="analysisText"></p>

    </div>

  </div>

</div>

<script>

let selectedVideo = null;

document.getElementById("videoInput").addEventListener("change", function(event) {

  selectedVideo = event.target.files[0];

  if (!selectedVideo) return;

  const video = document.getElementById("video");

  video.src = URL.createObjectURL(selectedVideo);

  video.style.display = "block";

  document.getElementById("status").innerText =
    "Video selected: " + selectedVideo.name;

});


async function analyzeVideo() {

  if (!selectedVideo) {

    alert("Please select a Reel first.");

    return;

  }

  const video = document.getElementById("video");

  const status = document.getElementById("status");

  status.innerText = "Analyzing your Reel...";

  video.currentTime = 0;

  await waitForVideoMetadata(video);

  const duration = video.duration;

  document.getElementById("duration").innerText =
    formatTime(duration);


  /*
    Check video format
  */

  const width = video.videoWidth;
  const height = video.videoHeight;

  let format = "Landscape";

  if (height > width) {

    format = "Vertical ✅";

  } else if (width === height) {

    format = "Square";

  }

  document.getElementById("format").innerText = format;


  /*
    Analyze frames
  */

  const canvas = document.createElement("canvas");

  canvas.width = 160;
  canvas.height = 160;

  const ctx = canvas.getContext("2d");

  let previousFrame = null;

  let sceneChanges = 0;

  const samples = Math.min(30, Math.max(10, Math.floor(duration)));

  for (let i = 0; i < samples; i++) {

    const time = (duration / samples) * i;

    await seekVideo(video, time);

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const frame = ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    ).data;

    if (previousFrame) {

      let difference = 0;

      for (let j = 0; j < frame.length; j += 16) {

        difference += Math.abs(
          frame[j] - previousFrame[j]
        );

      }

      difference =
        difference / (frame.length / 16);

      if (difference > 45) {

        sceneChanges++;

      }

    }

    previousFrame = new Uint8ClampedArray(frame);

  }


  /*
    Pacing score
  */

  const averageShot =
    duration / Math.max(1, sceneChanges + 1);

  let pacing = "Slow";

  if (averageShot < 2) {

    pacing = "Very Fast 🔥";

  } else if (averageShot < 4) {

    pacing = "Fast ⚡";

  } else if (averageShot < 7) {

    pacing = "Medium";

  }


  document.getElementById("sceneChanges").innerText =
    sceneChanges;

  document.getElementById("pacing").innerText =
    pacing;


  /*
    Basic scoring system
  */

  let score = 50;

  if (duration >= 10 && duration <= 45) {

    score += 15;

  } else if (duration < 10) {

    score += 5;

  }


  if (height > width) {

    score += 10;

  }


  if (sceneChanges >= 3 && sceneChanges <= 20) {

    score += 15;

  }


  if (averageShot < 5) {

    score += 10;

  }


  score = Math.min(100, score);


  document.getElementById("overallScore").innerText =
    score;


  /*
    Generate explanation
  */

  let message = "";

  if (score >= 85) {

    message =
      "This Reel has a strong basic structure. " +
      "Its length, vertical format and pacing are suitable " +
      "for short-form content. Focus next on making the first " +
      "1–3 seconds extremely attention-grabbing.";

  } else if (score >= 70) {

    message =
      "This Reel has a decent structure. " +
      "Try improving the opening hook and removing any " +
      "unnecessary pauses. Faster visual changes may also " +
      "help maintain attention.";

  } else {

    message =
      "The basic structure could be improved. " +
      "Consider making the opening more interesting, " +
      "reducing slow sections and keeping the story moving.";

  }


  document.getElementById("analysisText").innerText =
    message;


  document.getElementById("results").style.display =
    "block";

  status.innerText =
    "Analysis complete!";

}


function waitForVideoMetadata(video) {

  return new Promise(resolve => {

    if (video.readyState >= 1) {

      resolve();

    } else {

      video.addEventListener(
        "loadedmetadata",
        resolve,
        { once: true }
      );

    }

  });

}


function seekVideo(video, time) {

  return new Promise(resolve => {

    video.currentTime = time;

    video.addEventListener(
      "seeked",
      resolve,
      { once: true }
    );

  });

}


function formatTime(seconds) {

  const mins =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return mins + ":" +
    String(secs).padStart(2, "0");

}

</script>

</body>
</html>
